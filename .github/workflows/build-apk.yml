name: Build KING VPN APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

env:
  NDK_VERSION: "27.1.12297006"
  CI: "1"
  EXPO_NO_TELEMETRY: "1"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project root
        id: root
        run: |
          set -e
          d=$(find . -maxdepth 3 -name package.json -not -path '*/node_modules/*' -not -path '*/server/*' -not -path '*/modules/*' -printf '%d %h\n' | sort -n | head -n1 | cut -d' ' -f2-)
          [ -n "$d" ] || { echo "No package.json found"; exit 1; }
          echo "Project root: $d"
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK pieces and NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | sudo env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" "$SDKM" --licenses > /dev/null || true
          sudo env "PATH=$PATH" "JAVA_HOME=$JAVA_HOME" "$SDKM" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;${NDK_VERSION}"

      - name: Install JS dependencies
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund --legacy-peer-deps

      - name: Fetch native tunnel libraries
        working-directory: ${{ steps.root.outputs.dir }}
        run: bash scripts/fetch-native-libs.sh

      - name: Expo prebuild (generate android/)
        working-directory: ${{ steps.root.outputs.dir }}
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure Gradle
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          f=android/gradle.properties
          sed -i '/^org.gradle.jvmargs/d;/^reactNativeArchitectures/d;/^org.gradle.daemon/d' "$f"
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\n' >> "$f"
          printf 'reactNativeArchitectures=arm64-v8a,armeabi-v7a\n' >> "$f"
          printf 'org.gradle.daemon=false\n' >> "$f"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat "$f"

      - name: Show NDK settings (diagnostics)
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          grep -rn "ndkVersion" android/build.gradle android/app/build.gradle node_modules/react-native/gradle 2>/dev/null | head -20 || true
          ls "$ANDROID_HOME/ndk" || true

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        working-directory: ${{ steps.root.outputs.dir }}/android
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee ../build.log

      - name: Show the real Gradle error
        if: failure()
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          {
            echo "## Gradle failure summary"
            echo '```'
            grep -n -A30 "What went wrong" build.log | head -120 || true
            echo '--- Caused by ---'
            grep -n "Caused by" build.log | head -30 || true
            echo '--- Errors ---'
            grep -n -E "^e: |error:|FAILURE:|Execution failed" build.log | head -40 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ steps.root.outputs.dir }}/build.log
          if-no-files-found: ignore

      - name: Locate and verify the APK
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          set -e
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          [ -n "$APK" ] || { echo "APK not found"; exit 1; }
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          if ! "$APKSIGNER" verify "$APK"; then
            echo "APK unsigned, signing with a debug key"
            keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
              -alias debug -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            "$APKSIGNER" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android "$APK"
            "$APKSIGNER" verify "$APK"
          fi
          cp "$APK" king-vpn.apk
          ls -lh king-vpn.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: king-vpn-apk
          path: ${{ steps.root.outputs.dir }}/king-vpn.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: KING VPN build ${{ github.run_number }}
          files: ${{ steps.root.outputs.dir }}/king-vpn.apk
